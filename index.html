<style>
/* ══ RESET ══════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080b14;color:#e8eaf0;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{cursor:none}
@media(max-width:768px){body{cursor:auto}}

/* ══ VARIABLES ══════════════════════════════════════════════════ */
:root{
  --purple:#8b5cf6;
  --purple-l:#a78bfa;
  --acid:#b8ff00;
  --white:#f0f2f8;
  --grey:#6b7a99;
  --bg:#080b14;
  --NAV:64px;   /* nav height */
  --FOOT:48px;  /* footer height */
}

/* ══ CURSOR ═════════════════════════════════════════════════════ */
#cur,#cur2{position:fixed;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%)}
#cur{width:7px;height:7px;background:var(--purple-l);mix-blend-mode:screen;transition:width .2s,height .2s,background .2s}
#cur2{width:30px;height:30px;border:1px solid rgba(139,92,246,.3);z-index:99998}
@media(max-width:768px){#cur,#cur2{display:none}}

/* ══ CANVAS ════════════════════════════════════════════════════ */
#cv{position:fixed;inset:0;z-index:0}

/* ══ OVERLAYS ══════════════════════════════════════════════════ */
#scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.022) 2px,rgba(0,0,0,.022) 4px)}
#warp{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 55% 50%,rgba(139,92,246,.16) 0%,transparent 70%);transition:opacity .08s}

/* ══ LOADER ════════════════════════════════════════════════════ */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.ld-logo{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:14px;color:var(--white);opacity:0;animation:ldrise .6s .3s forwards ease-out}
@keyframes ldrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ld-track{width:200px;height:1px;background:rgba(139,92,246,.12)}
.ld-bar{height:100%;width:0;background:var(--purple-l)}
.ld-txt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(167,139,250,.45)}

/* ══ NAV ════════════════════════════════════════════════════════
   Solid 64px bar — nothing can overlap it
══════════════════════════════════════════════════════════════ */
#nav{
  position:fixed;top:0;left:0;right:0;
  height:var(--NAV);
  padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:800;
  background:#080b14;   /* fully opaque — no blur artifacts */
  border-bottom:1px solid rgba(139,92,246,.1);
}
.n-logo{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:6px;color:var(--white)}
.n-logo span{color:var(--purple-l)}
#n-links{display:flex;gap:24px;align-items:center}
.nl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:transparent;border:none;color:var(--grey);cursor:none;transition:color .25s;padding:4px 0;position:relative}
.nl::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--purple-l);transform:scaleX(0);transition:transform .25s;transform-origin:left}
.nl:hover{color:var(--white)}
.nl.on{color:var(--purple-l)}
.nl.on::after{transform:scaleX(1)}
#n-cta{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  background:var(--purple);color:var(--white);border:none;padding:9px 18px;
  cursor:none;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  transition:background .25s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
#n-cta:hover{background:var(--acid);color:#000}
/* Hamburger */
#n-ham{display:none;flex-direction:column;gap:5px;background:transparent;border:none;cursor:pointer;padding:4px}
#n-ham span{display:block;width:22px;height:1px;background:var(--white);transition:all .3s}
@media(max-width:768px){
  #n-links{display:none}
  #n-ham{display:flex}
}
/* Mobile dropdown */
#mob-nav{
  display:none;position:fixed;
  top:var(--NAV);left:0;right:0;
  background:#080b14;
  border-bottom:1px solid rgba(139,92,246,.1);
  z-index:799;flex-direction:column;
}
#mob-nav.open{display:flex}
.mnl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;background:transparent;border:none;border-bottom:1px solid rgba(139,92,246,.07);color:var(--grey);cursor:pointer;padding:16px 40px;text-align:left;transition:color .25s;width:100%}
.mnl.on,.mnl:hover{color:var(--purple-l)}

/* ══ FOOTER ════════════════════════════════════════════════════
   Solid 48px bar — nothing can overlap it
══════════════════════════════════════════════════════════════ */
#foot{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--FOOT);
  padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:800;
  background:#080b14;   /* fully opaque */
  border-top:1px solid rgba(139,92,246,.1);
}
.f-hint{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(240,242,248,.18);display:flex;align-items:center;gap:8px}
.f-hint::after{content:'';display:block;width:24px;height:1px;background:rgba(139,92,246,.3)}
#counter{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:5px;color:rgba(240,242,248,.2)}
#counter em{color:var(--purple-l);font-style:normal}

/* ══ SIDE DOTS ══════════════════════════════════════════════════ */
#sdots{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:700}
.sd{width:5px;height:5px;border-radius:50%;border:1px solid rgba(240,242,248,.18);background:transparent;cursor:none;transition:all .35s}
.sd:hover{border-color:rgba(139,92,246,.5)}
.sd.on{background:var(--purple-l);border-color:var(--purple-l);box-shadow:0 0 8px rgba(167,139,250,.8)}
@media(max-width:768px){#sdots{right:10px}}

/* ══ CORNER BRACKETS ══════════════════════════════════════════ */
.brk{position:fixed;width:12px;height:12px;z-index:700;opacity:.15}
.brk.tl{top:calc(var(--NAV) + 8px);left:14px;border-top:1px solid var(--purple-l);border-left:1px solid var(--purple-l)}
.brk.tr{top:calc(var(--NAV) + 8px);right:14px;border-top:1px solid var(--purple-l);border-right:1px solid var(--purple-l)}
.brk.bl{bottom:calc(var(--FOOT) + 8px);left:14px;border-bottom:1px solid var(--purple-l);border-left:1px solid var(--purple-l)}
.brk.br{bottom:calc(var(--FOOT) + 8px);right:14px;border-bottom:1px solid var(--purple-l);border-right:1px solid var(--purple-l)}

/* ══ BG WORD ═══════════════════════════════════════════════════ */
#bgw{
  position:fixed;right:44px;
  top:calc(var(--NAV) + 20px);
  bottom:calc(var(--FOOT) + 20px);
  display:flex;align-items:center;
  z-index:1;pointer-events:none;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(70px,9vw,130px);
  letter-spacing:-3px;line-height:1;
  color:transparent;
  -webkit-text-stroke:1px rgba(240,242,248,.038);
  text-align:right;max-width:46vw;word-break:break-word;
  transition:opacity .35s;
}
@media(max-width:768px){#bgw{display:none}}

/* ══ WHATSAPP FLOAT ══════════════════════════════════════════ */
#wa-float{
  position:fixed;
  bottom:calc(var(--FOOT) + 10px);
  right:40px;
  z-index:700;
  background:#25D366;color:#000;
  display:flex;align-items:center;gap:7px;
  padding:9px 16px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  text-decoration:none;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  transition:background .25s,transform .2s;
  box-shadow:0 4px 18px rgba(37,211,102,.22);
}
#wa-float:hover{background:#1ebe5c;transform:translateY(-2px)}
@media(max-width:768px){#wa-float{right:12px;font-size:8px;padding:8px 12px}}

/* ══════════════════════════════════════════════════════════════
   CONTENT PANEL
   ─ Starts exactly at NAV bottom, ends exactly at FOOT top
   ─ Internal padding keeps text away from both edges
   ─ overflow-y:auto + hidden scrollbar = content never clips
══════════════════════════════════════════════════════════════ */
#panel{
  position:fixed;
  top:var(--NAV);
  bottom:var(--FOOT);
  left:40px;
  width:min(500px,46vw);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:flex-start; /* ALWAYS top-aligned — never clips into nav */
  padding-top:28px;
  padding-bottom:20px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  -ms-overflow-style:none;
  pointer-events:all;
}
#panel::-webkit-scrollbar{display:none}
/* Mobile — full width, solid bg */
@media(max-width:768px){
  #panel{
    left:0;right:0;width:100%;
    padding:28px 22px 20px;
    background:rgba(8,11,20,.9);
    backdrop-filter:blur(10px);
    justify-content:flex-start;
    overflow-y:auto;
  }
}
#panel.exit{animation:pOut .22s forwards ease-in}
#panel.enter{animation:pIn .38s .04s both ease-out}
@keyframes pOut{to{opacity:0;transform:translateY(16px)}}
@keyframes pIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ── Panel typography ─────────────────────────────────────── */
.p-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:5px;text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:10px;
  color:var(--purple-l);flex-shrink:0;
}
.p-tag::before{content:'';flex-shrink:0;width:18px;height:1px;background:currentColor}

/* Heading — small enough that 3 lines NEVER exceed ~120px */
.p-h{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,2.3vw,36px);
  line-height:.94;letter-spacing:.5px;text-transform:uppercase;
  margin-bottom:8px;color:var(--white);flex-shrink:0;
}
@media(max-width:768px){.p-h{font-size:clamp(28px,6vw,40px)}}

.p-body{
  font-size:13px;line-height:1.68;
  color:#bfc6d8;
  font-weight:400;margin-bottom:10px;
  max-width:430px;flex-shrink:0;
}
@media(max-width:768px){.p-body{font-size:13.5px;color:#ccd2e2}}

/* List */
.p-list{display:flex;flex-direction:column;margin-bottom:10px}
.p-li{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;
  padding:5px 0;border-bottom:1px solid rgba(240,242,248,.07);
  color:#9faabf;
  display:flex;align-items:flex-start;gap:8px;line-height:1.45;
}
.p-li::before{content:'›';color:var(--purple-l);font-size:12px;flex-shrink:0;margin-top:1px}
.p-li.hl{color:#dde3f0;font-weight:400}
.p-li.hl::before{color:var(--acid)}

/* Buttons */
.p-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;flex-shrink:0}
.pb{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;
  background:var(--purple);color:var(--white);border:none;
  padding:9px 18px;cursor:none;
  clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);
  transition:background .25s,transform .2s;white-space:nowrap;
}
.pb:hover{background:var(--acid);color:#000;transform:translateY(-2px)}
.pb.g{background:transparent;border:1px solid rgba(240,242,248,.16);color:rgba(240,242,248,.55);clip-path:none}
.pb.g:hover{border-color:var(--purple-l);color:var(--purple-l);background:transparent}
@media(max-width:768px){.pb,.pb.g{cursor:pointer;font-size:10px;padding:10px 18px}}

/* Stats */
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ps-i{border:1px solid rgba(139,92,246,.2);padding:10px 8px;text-align:center;background:rgba(139,92,246,.04)}
.ps-n{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--purple-l);letter-spacing:-1px}
.ps-u{font-size:14px;color:var(--acid)}
.ps-l{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:3px}

/* Platform cards */
.p-plats{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.plt{border:1px solid rgba(240,242,248,.08);padding:9px 12px;display:flex;align-items:flex-start;gap:10px;transition:border-color .25s}
.plt:hover{border-color:rgba(139,92,246,.35)}
.plt-icon{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;min-width:38px;flex-shrink:0;line-height:1.2}
.plt-name{font-weight:500;font-size:12px;color:var(--white);margin-bottom:2px}
.plt-desc{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3px;color:var(--grey);line-height:1.45}

/* Metrics */
.p-mets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.pm{border:1px solid rgba(240,242,248,.07);padding:10px 12px;background:rgba(13,17,32,.6)}
.pm-n{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;letter-spacing:-1px;color:var(--acid)}
.pm-u{font-size:15px;color:rgba(184,255,0,.55)}
.pm-l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:2px}
.pm-sub{font-size:10px;color:#7a8599;margin-top:3px;line-height:1.35}

/* Process */
.p-proc{display:flex;flex-direction:column;margin-bottom:10px}
.proc-s{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(240,242,248,.06)}
.proc-n{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(139,92,246,.28);line-height:1;min-width:28px;flex-shrink:0}
.proc-name{font-weight:500;font-size:12px;color:var(--white);margin-bottom:2px}
.proc-desc{font-size:11px;color:#7a8599;line-height:1.4}

/* Testimonials */
.p-testis{display:flex;flex-direction:column;margin-bottom:10px}
.testi{padding:7px 0;border-bottom:1px solid rgba(240,242,248,.07)}
.t-stars{font-size:10px;letter-spacing:2px;color:var(--acid);margin-bottom:3px}
.t-q{font-size:11px;line-height:1.55;color:#b8c2d6;font-style:italic;margin-bottom:4px}
.t-who{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}

/* Contact form */
.p-form{display:flex;flex-direction:column;gap:7px}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:480px){.pf-row{grid-template-columns:1fr}}
.p-form input,.p-form textarea,.p-form select{
  background:rgba(240,242,248,.05);
  border:1px solid rgba(240,242,248,.1);
  color:var(--white);font-family:'Inter',sans-serif;font-size:12px;
  padding:9px 12px;outline:none;transition:border-color .25s;
  -webkit-appearance:none;appearance:none;width:100%;
}
.p-form input::placeholder,.p-form textarea::placeholder{color:rgba(240,242,248,.28)}
.p-form input:focus,.p-form textarea:focus,.p-form select:focus{border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.04)}
.p-form textarea{min-height:60px;resize:none}
.p-form select option{background:#0d1120;color:var(--white)}
.pf-sub{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;
  background:var(--purple);color:var(--white);border:none;padding:11px;
  cursor:none;width:100%;transition:background .25s,opacity .25s;
}
.pf-sub:hover{background:var(--acid);color:#000}
@media(max-width:768px){.pf-sub{cursor:pointer}}
.pf-or{display:flex;align-items:center;gap:8px}
.pf-or-l{flex:1;height:1px;background:rgba(240,242,248,.07)}
.pf-or-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(240,242,248,.2)}
.pf-wa{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:10px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:#25D366;border:1px solid rgba(37,211,102,.2);
  text-decoration:none;transition:background .25s,border-color .25s;
}
.pf-wa:hover{background:rgba(37,211,102,.06);border-color:rgba(37,211,102,.4)}
@media(max-width:768px){.pf-wa{cursor:pointer}}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="scan"></div>
<div id="warp"></div>
<div id="cur"></div>
<div id="cur2"></div>

<!-- LOADER -->
<div id="loader">
  <div class="ld-logo">EAS</div>
  <div class="ld-track"><div class="ld-bar" id="lbar"></div></div>
  <div class="ld-txt" id="ltxt">Initializing</div>
</div>

<!-- BRACKETS -->
<div class="brk tl"></div><div class="brk tr"></div>
<div class="brk bl"></div><div class="brk br"></div>

<!-- NAV -->
<nav id="nav">
  <div class="n-logo">EAS <span>·</span> CRM</div>
  <div id="n-links">
    <button class="nl on" id="nl0" onclick="goTo(0)">Home</button>
    <button class="nl" id="nl1" onclick="goTo(2)">Services</button>
    <button class="nl" id="nl2" onclick="goTo(4)">Platforms</button>
    <button class="nl" id="nl3" onclick="goTo(6)">Results</button>
    <button class="nl" id="nl4" onclick="goTo(8)">Contact</button>

/* ══ FORM SUBMIT — fetch to Formspree ════════════════════════ */
async function submitForm(e){
  e.preventDefault();
  const form=e.target;
  const btn=document.getElementById('pf-sub-btn');
  const name=form.querySelector('[name="name"]').value.trim();
  const email=form.querySelector('[name="email"]').value.trim();
  if(!name||!email){
    btn.textContent='Please fill name & email';
    btn.style.background='#ef4444';
    setTimeout(()=>{btn.textContent='Send Message →';btn.style.background='';},3000);
    return;
  }
  btn.textContent='Sending...';btn.style.opacity='.65';btn.disabled=true;
  try{
    const res=await fetch('https://formspree.io/f/mvzypzak',{
      method:'POST',
      body:new FormData(form),
      headers:{'Accept':'application/json'}
    });
    const json=await res.json();
    if(res.ok){
      btn.textContent='✓ Message Sent!';
      btn.style.background='#22c55e';btn.style.opacity='1';
      form.reset();
      setTimeout(()=>{btn.textContent='Send Message →';btn.style.background='';btn.disabled=false;},5000);
    }else{
      const err=json.errors?json.errors.map(x=>x.message).join(', '):'Submission failed';
      btn.textContent='Error — try WhatsApp';
      btn.style.background='#ef4444';btn.style.opacity='1';btn.disabled=false;
      setTimeout(()=>{btn.textContent='Send Message →';btn.style.background='';},4000);
    }
  }catch(err){
    btn.textContent='Network error — try WhatsApp';
    btn.style.background='#ef4444';btn.style.opacity='1';btn.disabled=false;
    setTimeout(()=>{btn.textContent='Send Message →';btn.style.background='';},4000);
  }
}

  requestAnimationFrame(render);
  const t=clock.getElapsedTime();
  if(!mob()){cLX+=(((mx-.5)*1.5)-cLX)*.04;cLY+=((-(my-.5)*1.0)-cLY)*.04;camera.position.x=cLX;camera.position.y=cLY;}
  camera.lookAt(nodeG.position);
  nodeG.rotation.x=t*.16;nodeG.rotation.y=t*.22;
  const b=1+Math.sin(t*1.1)*.03;nodeG.scale.set(b,b,b);
  apM.rotation.y=t*.01;apM.rotation.x=t*.005;
  curC.lerp(tgtC,.045);pL.color.copy(curC);
  pL.position.set(4+Math.sin(t*.5)*2,3+Math.cos(t*.4)*1.5,5);
  renderer.render(scene,camera);
}

/* ══ SECTIONS ════════════════════════════════════════════════ */
let cur=0,locked=false,lastNav=0;
const NAV_MAP={0:0,1:0,2:1,3:1,4:2,5:2,6:3,7:3,8:4};

// Build dots
const sdEl=document.getElementById('sdots');
SECTS.forEach((_,i)=>{
  const d=document.createElement('div');d.className='sd'+(i===0?' on':'');d.id='sd'+i;d.onclick=()=>goTo(i);sdEl.appendChild(d);
});
document.getElementById('ct').textContent=String(SECTS.length).padStart(2,'0');

function renderPanel(s){
  const p=document.getElementById('panel');
  p.className='exit';
  // Update tag color style
  const old=document.getElementById('tst');if(old)old.remove();
  setTimeout(()=>{
    const st=document.createElement('style');st.id='tst';
    st.textContent=`.p-tag{color:${s.tagC}!important}.p-tag::before{background:${s.tagC}!important}`;
    document.head.appendChild(st);
    const btns=s.btns.map(b=>`<button class="pb${b.g?' g':''}" onclick="(${b.f})()">${b.t}</button>`).join('');
    p.innerHTML=`
      <div class="p-tag">${s.tag}</div>
      <div class="p-h">${s.title.replace(/\n/g,'<br>')}</div>
      <div class="p-body">${s.body}</div>
      ${EX[s.ex]||''}
      ${btns?`<div class="p-btns">${btns}</div>`:''}
    `;
    // Reset scroll to top on each section
    p.scrollTop=0;
    p.className='enter';
  },230);
}

function goTo(idx){
  if(idx===cur||idx<0||idx>=SECTS.length)return;
  const now=Date.now();
  if(locked||now-lastNav<1100)return;
  locked=true;lastNav=now;
  setTimeout(()=>{locked=false;},1100);
  cur=idx;
  const s=SECTS[idx];
  // Flash
  const w=document.getElementById('warp');w.style.opacity='1';setTimeout(()=>{w.style.opacity='0';},100);
  // 3D
  buildNode(s.sh,s.nC);nodeG.position.set(mob()?0:3.2,0,0);
  // BG word
  const bw=document.getElementById('bgw');bw.style.opacity='0';
  setTimeout(()=>{bw.textContent=s.accent;bw.style.opacity='1';},280);bw.style.transition='opacity .3s';
  // Dots
  document.querySelectorAll('.sd').forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.querySelectorAll('.mnl').forEach((b,i)=>b.classList.toggle('on',i===NAV_MAP[idx]));
  // Counter
  document.getElementById('cc').textContent=String(idx+1).padStart(2,'0');
  // Nav links
  document.querySelectorAll('.nl').forEach((b,i)=>b.classList.toggle('on',i===NAV_MAP[idx]));
  // Hint
  document.querySelector('.f-hint').style.opacity=idx===0?'1':'0.3';
  renderPanel(s);
}

/* ══ MOBILE NAV ══════════════════════════════════════════════ */
window.toggleMob=function(){document.getElementById('mob-nav').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#mob-nav')&&!e.target.closest('#n-ham'))document.getElementById('mob-nav').classList.remove('open')});

/* ══ NAV RESPONSIVE ══════════════════════════════════════════ */
function checkNav(){
  const show=innerWidth>768;
  document.getElementById('n-links').style.display=show?'flex':'none';
  document.getElementById('n-ham').style.display=show?'none':'flex';
  if(show)document.getElementById('mob-nav').classList.remove('open');
}
checkNav();window.addEventListener('resize',()=>{checkNav();nodeG.position.set(mob()?0:3.2,0,0);renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ══ SCROLL INPUT — one section per deliberate gesture ═══════
   Double gate: timestamp (1100ms) + locked flag
   wAcc resets immediately on lock — no stacking
══════════════════════════════════════════════════════════════ */
let wAcc=0;
window.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=Date.now();
  if(locked||now-lastNav<1100){wAcc=0;return;}
  wAcc+=e.deltaY;
  if(Math.abs(wAcc)>=80){
    const dir=wAcc>0?1:-1;
    wAcc=0;
    goTo(cur+dir);
  }
},{passive:false});

let tY=0;
window.addEventListener('touchstart',e=>{tY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  if(locked||Date.now()-lastNav<1100)return;
  const dy=tY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>60)goTo(cur+(dy>0?1:-1));
},{passive:true});

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(cur+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(cur-1);
});

/* ══ LOADER ══════════════════════════════════════════════════ */
const MSGS=['Initializing','Mapping CRM Nodes','Calibrating Pipeline','Connecting Systems','Ready'];
let lp=0;
const lbar=document.getElementById('lbar'),ltxt=document.getElementById('ltxt');
const li=setInterval(()=>{
  lp+=Math.random()*16+5;if(lp>100)lp=100;
  lbar.style.width=lp+'%';
  ltxt.textContent=MSGS[Math.min(Math.floor(lp/25),4)];
  if(lp>=100){
    clearInterval(li);
    setTimeout(()=>{
      const ld=document.getElementById('loader');
      ld.style.transition='opacity .7s';ld.style.opacity='0';
      setTimeout(()=>{
        ld.style.display='none';
        buildNode(SECTS[0].sh,SECTS[0].nC);
        renderPanel(SECTS[0]);
        render();
      },720);
    },350);
  }
},65);
</script>
