<style>
/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080b14;color:#e8eaf0;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{cursor:none}
@media(max-width:768px){body{cursor:auto}}

/* ─── CSS VARS ─── */
:root{
  --bg:#080b14;
  --bg2:#0d1120;
  --purple:#8b5cf6;
  --purple-light:#a78bfa;
  --acid:#b8ff00;
  --white:#f0f2f8;
  --grey:#8892a4;
  --nav-h:64px;
  --foot-h:48px;
}

/* ─── CURSOR (desktop only) ─── */
#cur,#cur2{position:fixed;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%)}
#cur{width:7px;height:7px;background:var(--purple-light);transition:width .2s,height .2s,background .2s;mix-blend-mode:screen}
#cur2{width:32px;height:32px;border:1px solid rgba(139,92,246,.35);z-index:99998}
@media(max-width:768px){#cur,#cur2{display:none}}

/* ─── CANVAS ─── */
#cv{position:fixed;inset:0;z-index:0}

/* ─── SCAN LINES ─── */
#scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px)}

/* ─── WARP FLASH ─── */
#warp{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 55% 50%,rgba(139,92,246,.18) 0%,transparent 70%);transition:opacity .08s}

/* ─── LOADER ─── */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.ld-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:14px;color:var(--white);opacity:0;animation:rise .6s .3s forwards ease-out}
@keyframes rise{to{opacity:1;transform:none}from{opacity:0;transform:translateY(14px)}}
.ld-track{width:200px;height:1px;background:rgba(139,92,246,.15)}
.ld-bar{height:100%;width:0;background:var(--purple-light);transition:width .08s linear}
.ld-txt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(167,139,250,.5)}

/* ─── NAV ─── */
#nav{
  position:fixed;top:0;left:0;right:0;
  height:var(--nav-h);
  padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:500;
  background:rgba(8,11,20,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(139,92,246,.1);
}
.n-logo{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:6px;color:var(--white)}
.n-logo span{color:var(--purple-light)}
#n-links{display:flex;gap:24px;align-items:center}
.nl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:transparent;border:none;color:var(--grey);cursor:none;transition:color .25s;padding:4px 0;position:relative}
.nl::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--purple-light);transform:scaleX(0);transition:transform .25s;transform-origin:left}
.nl:hover{color:var(--white)}
.nl.on{color:var(--purple-light)}
.nl.on::after{transform:scaleX(1)}
#n-cta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:var(--purple);color:var(--white);border:none;padding:9px 18px;cursor:none;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .25s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
#n-cta:hover{background:var(--acid);color:#000}
/* Mobile nav */
#n-ham{display:none;flex-direction:column;gap:5px;background:transparent;border:none;cursor:pointer;padding:4px}
#n-ham span{display:block;width:22px;height:1px;background:var(--white);transition:all .3s}
#mob-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:rgba(8,11,20,.98);border-bottom:1px solid rgba(139,92,246,.1);z-index:499;padding:16px 0;flex-direction:column}
#mob-menu.open{display:flex}
.mob-nl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;background:transparent;border:none;color:var(--grey);cursor:pointer;padding:14px 40px;text-align:left;transition:color .25s;border:none;width:100%}
.mob-nl:hover,.mob-nl.on{color:var(--purple-light)}

/* ─── SIDE DOTS ─── */
#sdots{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:400}
.sd{width:5px;height:5px;border-radius:50%;border:1px solid rgba(240,242,248,.2);background:transparent;cursor:none;transition:all .35s}
.sd:hover{border-color:rgba(139,92,246,.6)}
.sd.on{background:var(--purple-light);border-color:var(--purple-light);box-shadow:0 0 8px rgba(167,139,250,.8)}
@media(max-width:768px){#sdots{right:10px}}

/* ─── CORNER BRACKETS ─── */
.brk{position:fixed;width:12px;height:12px;z-index:400;opacity:.18}
.brk.tl{top:var(--nav-h);left:14px;border-top:1px solid var(--purple-light);border-left:1px solid var(--purple-light)}
.brk.tr{top:var(--nav-h);right:14px;border-top:1px solid var(--purple-light);border-right:1px solid var(--purple-light)}
.brk.bl{bottom:var(--foot-h);left:14px;border-bottom:1px solid var(--purple-light);border-left:1px solid var(--purple-light)}
.brk.br{bottom:var(--foot-h);right:14px;border-bottom:1px solid var(--purple-light);border-right:1px solid var(--purple-light)}

/* ─── FOOTER ─── */
#foot{position:fixed;bottom:0;left:0;right:0;height:var(--foot-h);padding:0 40px;display:flex;align-items:center;justify-content:space-between;z-index:500;background:rgba(8,11,20,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(139,92,246,.1)}
#counter{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:5px;color:rgba(240,242,248,.25)}
#counter em{color:var(--purple-light);font-style:normal}
.f-hint{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(240,242,248,.2);display:flex;align-items:center;gap:8px}
.f-hint::after{content:'';display:block;width:28px;height:1px;background:linear-gradient(to right,rgba(139,92,246,.4),transparent)}

/* ─── BIG BG WORD ─── */
#bgw{position:fixed;right:40px;top:50%;transform:translateY(-50%);z-index:1;font-family:'Bebas Neue',sans-serif;font-size:clamp(70px,9vw,130px);letter-spacing:-3px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(240,242,248,.04);pointer-events:none;text-align:right;max-width:46vw;word-break:break-word;transition:opacity .35s}
@media(max-width:768px){#bgw{display:none}}

/* ─── WHATSAPP FLOAT ─── */
#wa-float{position:fixed;bottom:58px;right:40px;z-index:600;background:#25D366;color:#000;display:flex;align-items:center;gap:7px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .25s,transform .2s;box-shadow:0 4px 18px rgba(37,211,102,.25)}
#wa-float:hover{background:#1ebe5c;transform:translateY(-2px)}
@media(max-width:768px){#wa-float{right:14px;bottom:58px;font-size:8px;padding:8px 12px}}

/* ═══════════════════════════════════════════════
   CONTENT PANEL
═══════════════════════════════════════════════ */
#panel{
  position:fixed;
  top:0;
  left:40px;
  bottom:0;
  width:min(520px,48vw);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding-top:80px;
  padding-bottom:64px;
  /* scroll internally if content is too tall - bar hidden */
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  -ms-overflow-style:none;
  pointer-events:all;
}
/* Mobile: full width, scrollable */
@media(max-width:768px){
  #panel{
    left:0;right:0;
    width:100%;
    top:0;bottom:0;
    padding:80px 20px 64px;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    justify-content:flex-start;
    background:rgba(8,11,20,.88);
    backdrop-filter:blur(12px);
  }
}
#panel::-webkit-scrollbar{display:none}
#panel.exit{animation:pOut .25s forwards ease-in}
#panel.enter{animation:pIn .4s .05s both ease-out}
@keyframes pOut{to{opacity:0;transform:translateY(18px)}}
@keyframes pIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ── Panel elements ── */
.p-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:4px;text-transform:uppercase;
  margin-bottom:6px;display:flex;align-items:center;gap:8px;
  color:var(--purple-light);flex-shrink:0;
}
.p-tag::before{content:'';flex-shrink:0;width:20px;height:1px;background:currentColor}

.p-h{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(22px,2.1vw,36px);
  line-height:.93;letter-spacing:.5px;text-transform:uppercase;
  margin-bottom:8px;color:var(--white);flex-shrink:0;
}
@media(max-width:768px){.p-h{font-size:clamp(32px,8vw,52px)}}

.p-body{
  font-size:12px;line-height:1.6;
  color:#c4c9d8;
  font-weight:400;margin-bottom:8px;max-width:440px;flex-shrink:0;
}
@media(max-width:768px){.p-body{font-size:14px;color:#d0d5e8}}

/* List */
.p-list{display:flex;flex-direction:column;margin-bottom:8px}
.p-li{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;
  padding:5px 0;border-bottom:1px solid rgba(240,242,248,.07);
  color:#bcc4d6;
  display:flex;align-items:flex-start;gap:8px;line-height:1.4;
}
.p-li::before{content:'›';color:var(--purple-light);font-size:13px;flex-shrink:0;line-height:1.4}
@media(max-width:768px){.p-li{font-size:12px;color:#ccd2e4}}

/* Highlight list item */
.p-li.hl{color:var(--white);font-weight:400}
.p-li.hl::before{color:var(--acid)}

/* Buttons */
.p-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;flex-shrink:0}
.pb{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;background:var(--purple);color:var(--white);border:none;padding:9px 18px;cursor:none;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);transition:background .25s,transform .2s;white-space:nowrap}
.pb:hover{background:var(--acid);color:#000;transform:translateY(-2px)}
.pb.g{background:transparent;border:1px solid rgba(240,242,248,.18);color:rgba(240,242,248,.6);clip-path:none}
.pb.g:hover{border-color:var(--purple-light);color:var(--purple-light);background:transparent}
@media(max-width:768px){.pb{cursor:pointer;font-size:11px;padding:12px 20px}}

/* Stats row */
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.ps-item{border:1px solid rgba(139,92,246,.2);padding:10px 8px;text-align:center;background:rgba(139,92,246,.04)}
.ps-n{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--purple-light);letter-spacing:-1px}
.ps-u{font-size:16px;color:var(--acid)}
.ps-l{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:2px}
@media(max-width:768px){.ps-n{font-size:28px}}

/* Platform cards */
.p-plats{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.plt{border:1px solid rgba(240,242,248,.08);padding:9px 12px;display:flex;align-items:flex-start;gap:10px;transition:border-color .25s;cursor:default}
.plt:hover{border-color:rgba(139,92,246,.4)}
.plt-icon{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;min-width:40px;flex-shrink:0;line-height:1.2}
.plt-body{}
.plt-name{font-weight:500;font-size:12px;color:var(--white);margin-bottom:2px}
.plt-desc{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3px;color:var(--grey);line-height:1.45}

/* Metrics */
.p-mets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pm{border:1px solid rgba(240,242,248,.07);padding:10px 12px;background:rgba(13,17,32,.5)}
.pm-n{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;letter-spacing:-1px;color:var(--acid)}
.pm-u{font-size:15px;color:rgba(184,255,0,.6)}
.pm-l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:2px}
.pm-sub{font-size:10px;color:#9ca3af;margin-top:3px;line-height:1.35}

/* Process timeline */
.p-proc{display:flex;flex-direction:column;gap:0;margin-bottom:8px}
.proc-step{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(240,242,248,.06)}
.proc-n{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(139,92,246,.3);line-height:1;min-width:28px;flex-shrink:0}
.proc-body{}
.proc-name{font-weight:500;font-size:12px;color:var(--white);margin-bottom:1px}
.proc-desc{font-size:11px;color:#9ca3af;line-height:1.4}

/* Testimonials */
.p-testis{display:flex;flex-direction:column;gap:0;margin-bottom:8px}
.testi{padding:7px 0;border-bottom:1px solid rgba(240,242,248,.07)}
.t-stars{font-size:10px;letter-spacing:2px;color:var(--acid);margin-bottom:3px}
.t-q{font-size:11px;line-height:1.55;color:#c8cfe0;font-style:italic;margin-bottom:4px}
.t-who{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}

/* Contact form */
.p-form{display:flex;flex-direction:column;gap:6px}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:480px){.pf-row{grid-template-columns:1fr}}
.p-form input,.p-form textarea,.p-form select{
  background:rgba(240,242,248,.05);
  border:1px solid rgba(240,242,248,.12);
  color:var(--white);font-family:'Inter',sans-serif;font-size:12px;
  padding:9px 12px;outline:none;transition:border-color .25s;
  -webkit-appearance:none;appearance:none;width:100%;
}
.p-form input::placeholder,.p-form textarea::placeholder{color:rgba(240,242,248,.3)}
.p-form input:focus,.p-form textarea:focus,.p-form select:focus{border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.04)}
.p-form textarea{min-height:56px;resize:none}
.p-form select option{background:#0d1120;color:var(--white)}
.pf-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;background:var(--purple);color:var(--white);border:none;padding:10px;cursor:none;width:100%;transition:background .25s}
.pf-sub:hover{background:var(--acid);color:#000}
@media(max-width:768px){.pf-sub{cursor:pointer}}
.pf-or{display:flex;align-items:center;gap:8px;margin:2px 0}
.pf-or-line{flex:1;height:1px;background:rgba(240,242,248,.07)}
.pf-or-txt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(240,242,248,.2)}
.pf-wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#25D366;border:1px solid rgba(37,211,102,.2);text-decoration:none;transition:background .25s,border-color .25s}
.pf-wa:hover{background:rgba(37,211,102,.06);border-color:rgba(37,211,102,.4)}
@media(max-width:768px){.pf-wa{cursor:pointer}}
</style>

async function submitForm(e){
  e.preventDefault();
  const form = e.target;

  const name = data.get('name');
  if(!name||!email){btn.textContent='Please fill name & email';return;}

  btn.textContent='Sending...';
  btn.style.opacity='0.7';
  btn.disabled=true;

  try{
    const res = await fetch('https://formspree.io/f/mvzypzak',{
      method:'POST',
      body:data,
      headers:{'Accept':'application/json'}
    });
    const json = await res.json();
    if(res.ok){
      btn.textContent='✓ Message Sent!';
      btn.style.background='#22c55e';
      btn.style.opacity='1';
      form.reset();
      setTimeout(()=>{
        btn.textContent='Send Message →';
        btn.style.background='';
        btn.disabled=false;
      },5000);
    } else {
      // Formspree returned an error
      const msg = json.errors ? json.errors.map(e=>e.message).join(', ') : 'Submission failed';

      btn.style.background='#ef4444';
      btn.style.opacity='1';

  const col=new THREE.Color(hex), geo=mkGeo(sh);
  nodeGrp.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,wireframe:true,transparent:true,opacity:.22})));
  nodeGrp.add(new THREE.Mesh(geo.clone(),new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:.055,roughness:.4,metalness:.8})));
  const rA=new THREE.Mesh(new THREE.TorusGeometry(2.5,.007,8,120),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.1}));
  rA.rotation.x=Math.PI/2.4; nodeGrp.add(rA);
  const rB=rA.clone(); rB.rotation.set(Math.PI/4,Math.PI/6,0); rB.material=rA.material.clone(); rB.material.opacity=.06; nodeGrp.add(rB);
  const hG=new THREE.BufferGeometry(),hN=180,hp=new Float32Array(hN*3);
  for(let i=0;i<hN;i++){const t=Math.random()*Math.PI*2,p=Math.random()*Math.PI,r=2.1+Math.random()*1.3;hp[i*3]=r*Math.sin(p)*Math.cos(t);hp[i*3+1]=r*Math.sin(p)*Math.sin(t);hp[i*3+2]=r*Math.cos(p)}
  hG.setAttribute('position',new THREE.BufferAttribute(hp,3));
  nodeGrp.add(new THREE.Points(hG,new THREE.PointsMaterial({color:col,size:.065,transparent:true,opacity:.4})));
  tgtC.set(col);
}

/* ══════════════════════════════════════════
   CURSOR
══════════════════════════════════════════ */
const cEl=document.getElementById('cur'),c2El=document.getElementById('cur2');
let cx=innerWidth/2,cy=innerHeight/2,rx=cx,ry=cy,mx=.5,my=.5;
document.addEventListener('mousemove',e=>{
  cx=e.clientX;cy=e.clientY;
  if(cEl){cEl.style.left=cx+'px';cEl.style.top=cy+'px';}
  mx=e.clientX/innerWidth; my=e.clientY/innerHeight;
});
(function animC(){rx+=(cx-rx)*.1;ry+=(cy-ry)*.1;if(c2El){c2El.style.left=rx+'px';c2El.style.top=ry+'px';}requestAnimationFrame(animC)})();

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
const clock=new THREE.Clock();
let cLX=0,cLY=0;
function render(){
  requestAnimationFrame(render);
  const t=clock.getElapsedTime();
  if(!isMob()){
    cLX+=(((mx-.5)*1.5)-cLX)*.04;
    cLY+=((-(my-.5)*1.0)-cLY)*.04;
    camera.position.x=cLX; camera.position.y=cLY;
  }
  camera.lookAt(nodeGrp.position);
  nodeGrp.rotation.x=t*.16; nodeGrp.rotation.y=t*.22;
  const b=1+Math.sin(t*1.1)*.03; nodeGrp.scale.set(b,b,b);
  apMesh.rotation.y=t*.01; apMesh.rotation.x=t*.005;
  curC.lerp(tgtC,.045); pL.color.copy(curC);
  pL.position.set(4+Math.sin(t*.5)*2,3+Math.cos(t*.4)*1.5,5);
  renderer.render(scene,camera);
}

/* ══════════════════════════════════════════
   NAV & SECTIONS
══════════════════════════════════════════ */
let cur=0, locked=false;
const NAV_MAP={0:0,1:0,2:1,3:1,4:2,5:2,6:3,7:3,8:4};

// Build dots
const sdEl=document.getElementById('sdots');
SECTS.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='sd'+(i===0?' on':'');
  d.id='sd'+i; d.onclick=()=>goTo(i);
  sdEl.appendChild(d);
});
document.getElementById('ct').textContent=String(SECTS.length).padStart(2,'0');

function renderPanel(s){
  const p=document.getElementById('panel');
  p.className='exit';
  // Tag style
  const old=document.getElementById('tst'); if(old)old.remove();
  setTimeout(()=>{
    const st=document.createElement('style');
    st.id='tst';
    st.textContent=`.p-tag{color:${s.tagC}!important}.p-tag::before{background:${s.tagC}!important}`;
    document.head.appendChild(st);
    const btnsHtml=s.btns.map(b=>`<button class="pb${b.g?' g':''}" onclick="(${b.f})()">${b.t}</button>`).join('');
    p.innerHTML=`
      <div class="p-tag">${s.tag}</div>
      <div class="p-h">${s.title.replace(/\n/g,'<br>')}</div>
      <div class="p-body">${s.body}</div>
      ${EXTRA[s.extra]||''}
      ${btnsHtml?`<div class="p-btns">${btnsHtml}</div>`:''}
    `;
    p.className='enter';
  },240);
}

function goTo(idx){
  if(locked||idx===cur||idx<0||idx>=SECTS.length) return;
  locked=true;
  setTimeout(()=>{ locked=false; },1100);
  cur=idx;
  const s=SECTS[idx];
  // Warp flash
  const w=document.getElementById('warp');
  w.style.opacity='1'; setTimeout(()=>{ w.style.opacity='0'; },100);
  // 3D
  buildNode(s.shape,s.nodeC);
  nodeGrp.position.set(isMob()?0:3.2,0,0);
  // BG word
  const bw=document.getElementById('bgw');
  bw.style.opacity='0'; setTimeout(()=>{ bw.textContent=s.accent; bw.style.opacity='1'; },280);
  // Dots
  document.querySelectorAll('.sd').forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.querySelectorAll('.mob-nl').forEach((b,i)=>b.classList.toggle('on',NAV_MAP[idx]===i));
  // Counter
  document.getElementById('cc').textContent=String(idx+1).padStart(2,'0');
  // Nav
  document.querySelectorAll('.nl').forEach((b,i)=>b.classList.toggle('on',i===NAV_MAP[idx]));
  // Scroll hint
  document.querySelector('.f-hint').style.opacity=idx===0?'1':'0.35';
  renderPanel(s);
}

/* Mobile hamburger */
window.toggleMob=function(){
  const m=document.getElementById('mob-menu');
  m.classList.toggle('open');
}
// Close mob menu on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('#mob-menu')&&!e.target.closest('#n-ham')) document.getElementById('mob-menu').classList.remove('open');
});

/* ══════════════════════════════════════════
   INPUT — strict single-step
══════════════════════════════════════════ */
let wAcc=0, lastScroll=0;
window.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=Date.now();
  // Hard time gate: ignore ALL wheel events within 1100ms of last navigation
  if(now-lastScroll<1100){wAcc=0;return;}
  wAcc+=e.deltaY;
  if(Math.abs(wAcc)>=60){
    const dir=wAcc>0?1:-1;
    wAcc=0;
    lastScroll=now;
    goTo(cur+dir);
  }
},{passive:false});

let tY=0;
window.addEventListener('touchstart',e=>{tY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  if(locked)return;
  const dy=tY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>60){lastScroll=Date.now();goTo(cur+(dy>0?1:-1));}
},{passive:true});

window.addEventListener('keydown',e=>{
  if(locked)return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(cur+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(cur-1);
});

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  nodeGrp.position.set(isMob()?0:3.2,0,0);
});

/* ══════════════════════════════════════════
   RESPONSIVE NAV VISIBILITY
══════════════════════════════════════════ */
function checkNav(){
  const links=document.getElementById('n-links');
  const ham=document.getElementById('n-ham');
  if(innerWidth<=768){
    links.style.display='none'; ham.style.display='flex';
  } else {
    links.style.display='flex'; ham.style.display='none';
    document.getElementById('mob-menu').classList.remove('open');
  }
}
checkNav();
window.addEventListener('resize',checkNav);

/* ══════════════════════════════════════════
   LOADER
══════════════════════════════════════════ */
const MSGS=['Initializing','Mapping CRM Nodes','Calibrating Pipeline','Connecting Systems','Ready'];
let lp=0;
const lbar=document.getElementById('lbar'), ltxt=document.getElementById('ltxt');
const li=setInterval(()=>{
  lp+=Math.random()*16+5; if(lp>100)lp=100;
  lbar.style.width=lp+'%';
  ltxt.textContent=MSGS[Math.min(Math.floor(lp/25),4)];
  if(lp>=100){
    clearInterval(li);
    setTimeout(()=>{
      const ld=document.getElementById('loader');
      ld.style.transition='opacity .7s'; ld.style.opacity='0';
      setTimeout(()=>{
        ld.style.display='none';
        buildNode(SECTS[0].shape,SECTS[0].nodeC);
        renderPanel(SECTS[0]);
        render();
      },720);
    },350);
  }
},65);
</script>
