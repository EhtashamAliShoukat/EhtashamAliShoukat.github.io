<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ehtasham Ali S. — CRM Architect</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ── RESET ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02020a;color:#f0ece8;font-family:'Inter',sans-serif;cursor:none;-webkit-font-smoothing:antialiased}

/* ── CURSOR ── */
#cur{position:fixed;width:8px;height:8px;border-radius:50%;background:#a78bfa;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;mix-blend-mode:screen}
#cur2{position:fixed;width:36px;height:36px;border-radius:50%;border:1px solid rgba(167,139,250,.3);pointer-events:none;z-index:99998;transform:translate(-50%,-50%)}

/* ── CANVAS ── */
#canvas3d{position:fixed;inset:0;z-index:0}

/* ── SCANLINES ── */
#scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);opacity:.5}

/* ── WARP FLASH ── */
#warp{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 60% 50%,rgba(167,139,250,.15) 0%,transparent 70%)}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:#02020a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.ld-name{font-family:'Bebas Neue',sans-serif;font-size:60px;letter-spacing:14px;color:#f0ece8;opacity:0;transform:translateY(16px);animation:ldrise .7s .2s forwards ease-out}
@keyframes ldrise{to{opacity:1;transform:none}}
.ld-track{width:220px;height:1px;background:rgba(167,139,250,.12)}
.ld-fill{height:100%;width:0;background:#a78bfa}
.ld-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(167,139,250,.45)}

/* ─────────────────────────────────────────────────────────
   LAYOUT — strict grid:
   NAV:      fixed 72px tall at top
   PANEL:    from 80px to calc(100% - 68px)   [safe zone]
   FOOTER:   fixed 52px tall at bottom
   3D NODE:  right half, centered vertically
───────────────────────────────────────────────────────── */

/* ── NAV ── */
#nav{
  position:fixed;
  top:0;left:0;right:0;
  height:72px;
  padding:0 48px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:500;
  /* solid enough to always cover anything below */
  background:rgba(2,2,10,.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(167,139,250,.06);
}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:8px;color:#f0ece8}
#nav-btns{display:flex;gap:28px;align-items:center}
.nb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:transparent;border:none;color:rgba(240,236,232,.3);cursor:none;transition:color .3s;padding:0;position:relative}
.nb::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:#a78bfa;transform:scaleX(0);transition:transform .3s;transform-origin:left}
.nb:hover{color:rgba(240,236,232,.7)}
.nb.on{color:#a78bfa}
.nb.on::after{transform:scaleX(1)}
#nav-cta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:#a78bfa;color:#02020a;border:none;padding:10px 20px;cursor:none;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .25s,transform .2s;text-decoration:none;display:inline-block;line-height:1.4}
#nav-cta:hover{background:#c4ff00;transform:translateY(-1px)}

/* ── CORNER BRACKETS ── */
.brk{position:fixed;width:14px;height:14px;z-index:400;opacity:.2}
.brk.tl{top:80px;left:16px;border-top:1px solid #a78bfa;border-left:1px solid #a78bfa}
.brk.tr{top:80px;right:16px;border-top:1px solid #a78bfa;border-right:1px solid #a78bfa}
.brk.bl{bottom:60px;left:16px;border-bottom:1px solid #a78bfa;border-left:1px solid #a78bfa}
.brk.br{bottom:60px;right:16px;border-bottom:1px solid #a78bfa;border-right:1px solid #a78bfa}

/* ── CONTENT PANEL ──
   top: 80px     (8px below the 72px nav — clear gap)
   bottom: 68px  (16px above the 52px footer bar)
   width: 44vw max 480px — leaves right half for 3D
   overflow:hidden so nothing can ever bleed out
───────────────────────────────────────────────────────── */
#panel{
  position:fixed;
  top:72px;
  left:48px;
  bottom:52px;
  width:min(500px,44vw);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  /* internal padding keeps content off the nav/footer edges */
  padding:20px 0 20px 0;
  overflow:hidden;
  pointer-events:all;
}
/* inner scroller so if content is taller than safe zone it stays inside */
#panel-inner{
  display:flex;
  flex-direction:column;
  gap:0;
  max-height:100%;
  overflow:hidden;
}
#panel.exit{animation:pOut .28s forwards ease-in}
#panel.enter{animation:pIn .45s .05s both ease-out}
@keyframes pOut{to{opacity:0;transform:translateY(20px)}}
@keyframes pIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.p-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.p-tag::before{content:'';flex-shrink:0;width:20px;height:1px}

/* Heading — capped so 3-line titles always fit */
.p-h{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,2.4vw,40px);
  line-height:.93;
  letter-spacing:.5px;
  text-transform:uppercase;
  margin-bottom:10px;
  flex-shrink:0;
}
.p-body{font-size:13px;line-height:1.65;color:rgba(240,236,232,.46);font-weight:300;margin-bottom:10px;max-width:420px;flex-shrink:0}

.p-list{display:flex;flex-direction:column;gap:0;margin-bottom:14px}
.p-li{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.3px;padding:6px 0;border-bottom:1px solid rgba(240,236,232,.055);color:rgba(240,236,232,.38);display:flex;align-items:center;gap:9px}
.p-li::before{content:'›';font-size:13px;flex-shrink:0;line-height:1}

.p-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;flex-shrink:0}
.p-btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:#a78bfa;color:#02020a;border:none;padding:11px 22px;cursor:none;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);transition:background .25s,transform .2s;white-space:nowrap}
.p-btn:hover{background:#c4ff00;transform:translateY(-2px)}
.p-btn.g{background:transparent;border:1px solid rgba(240,236,232,.14);color:rgba(240,236,232,.4);clip-path:none}
.p-btn.g:hover{border-color:#a78bfa;color:#a78bfa;background:transparent}

/* Metrics */
.p-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.p-met{border:1px solid rgba(240,236,232,.07);padding:16px 18px}
.pm-n{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;letter-spacing:-1px;margin-bottom:2px}
.pm-u{font-size:20px}
.pm-l{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,236,232,.28);margin-top:3px}

/* Testimonials */
.p-testi{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
.pt-item{padding:7px 0;border-bottom:1px solid rgba(240,236,232,.06)}
.pt-stars{font-size:10px;letter-spacing:3px;margin-bottom:4px}
.pt-q{font-size:12px;line-height:1.6;color:rgba(240,236,232,.48);font-style:italic;margin-bottom:4px}
.pt-who{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,236,232,.22)}

/* Contact form */
.p-form{display:flex;flex-direction:column;gap:9px}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.p-form input,.p-form textarea,.p-form select{background:rgba(240,236,232,.04);border:1px solid rgba(240,236,232,.1);color:#f0ece8;font-family:'Inter',sans-serif;font-size:13px;padding:10px 13px;outline:none;transition:border-color .25s;-webkit-appearance:none;appearance:none;width:100%}
.p-form input:focus,.p-form textarea:focus,.p-form select:focus{border-color:rgba(167,139,250,.4)}
.p-form textarea{min-height:72px;resize:none}
.p-form select option{background:#04040f}
.pf-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;background:#a78bfa;color:#02020a;border:none;padding:12px;cursor:none;width:100%;transition:background .25s}
.pf-sub:hover{background:#c4ff00}

/* ── BIG ACCENT WORD — right side, purely decorative ── */
#bgword{
  position:fixed;
  right:48px;
  top:50%;
  transform:translateY(-50%);
  z-index:50;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(80px,10vw,150px);
  letter-spacing:-3px;
  line-height:1;
  color:transparent;
  -webkit-text-stroke:1px rgba(240,236,232,.038);
  pointer-events:none;
  text-align:right;
  /* keep it on right half only */
  max-width:46vw;
  word-break:break-word;
  transition:opacity .4s;
}

/* ── FOOTER BAR ── */
#footer{
  position:fixed;
  bottom:0;left:0;right:0;
  height:52px;
  padding:0 48px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:500;
  background:rgba(2,2,10,.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(167,139,250,.06);
}
#counter{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:5px;color:rgba(240,236,232,.18)}
#counter em{color:rgba(167,139,250,.55);font-style:normal}
#shint{display:flex;align-items:center;gap:10px}
.sh-word{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(240,236,232,.18)}
.sh-arrow{width:32px;height:1px;background:linear-gradient(to right,rgba(167,139,250,0),rgba(167,139,250,.4))}

/* ── SIDE DOTS ── */
#sdots{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:400;pointer-events:all}
.sdot{width:5px;height:5px;border-radius:50%;border:1px solid rgba(240,236,232,.18);background:transparent;cursor:none;transition:all .35s}
.sdot:hover{border-color:rgba(167,139,250,.5)}
.sdot.on{background:#a78bfa;border-color:#a78bfa;box-shadow:0 0 8px rgba(167,139,250,.8)}

/* ── WHATSAPP FLOAT ── */
#wa-btn{
  position:fixed;
  bottom:62px;
  right:52px;
  z-index:600;
  background:#25D366;
  color:#000;
  display:flex;align-items:center;gap:6px;
  padding:9px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  text-decoration:none;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  transition:background .25s,transform .2s;
  box-shadow:0 4px 20px rgba(37,211,102,.3);
}
#wa-btn:hover{background:#1ebe5c;transform:translateY(-2px)}

/* ── WA ALT BUTTON IN FORM ── */
.wa-alt-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:10px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:3px;text-transform:uppercase;
  color:#25D366;
  border:1px solid rgba(37,211,102,.25);
  text-decoration:none;
  transition:background .25s,border-color .25s;
  cursor:none;
}
.wa-alt-btn:hover{background:rgba(37,211,102,.07);border-color:rgba(37,211,102,.5)}
</style>
</head>

function submitCF(e){
  e.preventDefault();
  const b=e.target.querySelector('.pf-sub');
  b.textContent='✓ Sent — reply within 24h';b.style.background='#4ade80';
  setTimeout(()=>{b.textContent='Send Message →';b.style.background='';e.target.reset();},4000);
}

/* ════════════════════════════════════════════════
   THREE.JS
════════════════════════════════════════════════ */
const cv=document.getElementById('canvas3d');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x02020a,1);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x02020a,.013);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
camera.position.set(0,0,8);

// Lights
const aL=new THREE.AmbientLight(0x111133,3); scene.add(aL);
const pA=new THREE.PointLight(0xa78bfa,8,40); pA.position.set(4,3,5); scene.add(pA);
const pB=new THREE.PointLight(0xc4ff00,3,30); pB.position.set(-5,-2,3); scene.add(pB);

// Stars
(()=>{
  const g=new THREE.BufferGeometry();
  const n=7000,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*400;p[i*3+1]=(Math.random()-.5)*400;p[i*3+2]=(Math.random()-.5)*400}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.055,transparent:true,opacity:.6})));
})();

// Ambient colour particles
const apG=new THREE.BufferGeometry();
const apN=500,apP=new Float32Array(apN*3),apC=new Float32Array(apN*3);
for(let i=0;i<apN;i++){
  apP[i*3]=(Math.random()-.5)*30;apP[i*3+1]=(Math.random()-.5)*20;apP[i*3+2]=(Math.random()-.5)*18-2;
  const c=new THREE.Color().setHSL(.72+Math.random()*.15,.7,.5+Math.random()*.3);
  apC[i*3]=c.r;apC[i*3+1]=c.g;apC[i*3+2]=c.b;
}
apG.setAttribute('position',new THREE.BufferAttribute(apP,3));
apG.setAttribute('color',new THREE.BufferAttribute(apC,3));
const apMesh=new THREE.Points(apG,new THREE.PointsMaterial({size:.075,vertexColors:true,transparent:true,opacity:.4}));
scene.add(apMesh);

// Node group — positioned right-center, panel is left
const nodeGrp=new THREE.Group();
nodeGrp.position.set(3.2,0,0);
scene.add(nodeGrp);

function mkGeo(sh){
  switch(sh){
    case 'knot':         return new THREE.TorusKnotGeometry(1.3,.36,160,18,2,3);
    case 'dodecahedron': return new THREE.DodecahedronGeometry(1.5,0);
    case 'octahedron':   return new THREE.OctahedronGeometry(1.55,0);
    case 'torus':        return new THREE.TorusGeometry(1.2,.4,18,80);
    case 'icosahedron':  return new THREE.IcosahedronGeometry(1.5,1);
    case 'sphere':       return new THREE.IcosahedronGeometry(1.4,2);
    default:             return new THREE.IcosahedronGeometry(1.4,1);
  }
}

const curNodeCol=new THREE.Color(0xa78bfa);
const tgtNodeCol=new THREE.Color(0xa78bfa);

function buildNode(sh,hex){
  while(nodeGrp.children.length) nodeGrp.remove(nodeGrp.children[0]);
  const col=new THREE.Color(hex);
  const geo=mkGeo(sh);
  // wireframe
  nodeGrp.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,wireframe:true,transparent:true,opacity:.22})));
  // solid inner
  nodeGrp.add(new THREE.Mesh(geo.clone(),new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:.055,roughness:.4,metalness:.8})));
  // orbit ring A
  const rA=new THREE.Mesh(new THREE.TorusGeometry(2.5,.007,8,120),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.1}));
  rA.rotation.x=Math.PI/2.4; nodeGrp.add(rA);
  // orbit ring B
  const rB=rA.clone(); rB.rotation.set(Math.PI/4,Math.PI/6,0);
  rB.material=rA.material.clone(); rB.material.opacity=.06; nodeGrp.add(rB);
  // halo particles
  const hG=new THREE.BufferGeometry(),hN=180,hp=new Float32Array(hN*3);
  for(let i=0;i<hN;i++){const t=Math.random()*Math.PI*2,p=Math.random()*Math.PI,r=2.1+Math.random()*1.3;hp[i*3]=r*Math.sin(p)*Math.cos(t);hp[i*3+1]=r*Math.sin(p)*Math.sin(t);hp[i*3+2]=r*Math.cos(p)}
  hG.setAttribute('position',new THREE.BufferAttribute(hp,3));
  nodeGrp.add(new THREE.Points(hG,new THREE.PointsMaterial({color:col,size:.065,transparent:true,opacity:.45})));
  tgtNodeCol.set(col);
}

/* ════════════════════════════════════════════════
   CURSOR
════════════════════════════════════════════════ */
const cEl=document.getElementById('cur'),c2El=document.getElementById('cur2');
let cx=innerWidth/2,cy=innerHeight/2,rx=cx,ry=cy,mx=.5,my=.5;
document.addEventListener('mousemove',e=>{
  cx=e.clientX;cy=e.clientY;
  cEl.style.left=cx+'px';cEl.style.top=cy+'px';
  mx=e.clientX/innerWidth;my=e.clientY/innerHeight;
});
(function animC(){rx+=(cx-rx)*.1;ry+=(cy-ry)*.1;c2El.style.left=rx+'px';c2El.style.top=ry+'px';requestAnimationFrame(animC)})();

/* ════════════════════════════════════════════════
   RENDER LOOP
════════════════════════════════════════════════ */
const clock=new THREE.Clock();
let camLX=0,camLY=0;

function renderLoop(){
  requestAnimationFrame(renderLoop);
  const t=clock.getElapsedTime();
  camLX+=(((mx-.5)*1.6)-camLX)*.04;
  camLY+=((-(my-.5)*1.1)-camLY)*.04;
  camera.position.x=camLX; camera.position.y=camLY;
  camera.lookAt(nodeGrp.position);
  nodeGrp.rotation.x=t*.17; nodeGrp.rotation.y=t*.24;
  const b=1+Math.sin(t*1.1)*.032; nodeGrp.scale.set(b,b,b);
  apMesh.rotation.y=t*.011; apMesh.rotation.x=t*.005;
  curNodeCol.lerp(tgtNodeCol,.045);
  pA.color.copy(curNodeCol);
  pA.position.set(4+Math.sin(t*.5)*2,3+Math.cos(t*.4)*1.5,5);
  renderer.render(scene,camera);
}

/* ════════════════════════════════════════════════
   SECTIONS & NAVIGATION
════════════════════════════════════════════════ */
let cur=0, locked=false;

// Build side dots
const sdEl=document.getElementById('sdots');
S.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='sdot'+(i===0?' on':'');
  d.id='sd'+i; d.onclick=()=>goTo(i);
  sdEl.appendChild(d);
});
document.getElementById('ct').textContent=String(S.length).padStart(2,'0');

const NAV_MAP={0:0,1:0,2:1,3:1,4:2,5:2,6:3,7:3,8:4};

function renderPanel(s){
  const p=document.getElementById('panel');
  p.className='exit';
  setTimeout(()=>{
    // Build tag style
    const old=document.getElementById('tst'); if(old) old.remove();
    const st=document.createElement('style');
    st.id='tst';
    st.textContent=`.p-tag::before{background:${s.tagC}!important}`;
    document.head.appendChild(st);

    const btnsHtml=s.btns.map(b=>`<button class="p-btn${b.g?' g':''}" onclick="goTo(${b.f})">${b.t}</button>`).join('');
    p.innerHTML=`
      <div id="panel-inner">
        <div class="p-tag" style="color:${s.tagC}">${s.tag}</div>
        <div class="p-h">${s.title.replace(/\n/g,'<br>')}</div>
        <div class="p-body">${s.body}</div>
        ${EXTRA[s.extra]||''}
        ${btnsHtml?`<div class="p-btns">${btnsHtml}</div>`:''}
      </div>
    `;
    p.className='enter';
  },270);
}

function goTo(idx){
  if(locked||idx===cur||idx<0||idx>=S.length) return;
  locked=true;
  // ── Reset lock after 1s — and ONLY after 1s. No early unlock.
  setTimeout(()=>{ locked=false; }, 1000);

  cur=idx;
  const s=S[idx];

  // Warp flash
  const w=document.getElementById('warp');
  w.style.transition='opacity .1s'; w.style.opacity='1';
  setTimeout(()=>{ w.style.transition='opacity .55s'; w.style.opacity='0'; },110);

  // Rebuild 3D node
  buildNode(s.shape,s.nodeC);

  // Accent word
  const bw=document.getElementById('bgword');
  bw.style.opacity='0';
  setTimeout(()=>{ bw.textContent=s.accent; bw.style.opacity='1'; },300);
  bw.style.transition='opacity .3s';

  // Dots
  document.querySelectorAll('.sdot').forEach((d,i)=>d.classList.toggle('on',i===idx));

  // Counter
  document.getElementById('cc').textContent=String(idx+1).padStart(2,'0');

  // Nav
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('on',i===NAV_MAP[idx]));

  // Scroll hint visibility
  document.getElementById('shint').style.opacity=idx===0?'1':'0.4';

  renderPanel(s);
}

/* ════════════════════════════════════════════════
   INPUT — single section per gesture, strict gate
════════════════════════════════════════════════ */

/* WHEEL — accumulate delta, fire once threshold crossed,
   then HARD RESET accumulator and block until lock clears */
let wAcc=0;
const W_THRESH=80;

window.addEventListener('wheel',e=>{
  e.preventDefault();
  // If locked, swallow the event completely — no accumulation
  if(locked){ wAcc=0; return; }
  wAcc+=e.deltaY;
  if(Math.abs(wAcc)>=W_THRESH){
    const dir=wAcc>0?1:-1;
    wAcc=0;          // reset BEFORE goTo so it can't double-fire
    goTo(cur+dir);
  }
},{passive:false});

/* TOUCH */
let tY=0;
window.addEventListener('touchstart',e=>{ tY=e.touches[0].clientY; },{passive:true});
window.addEventListener('touchend',e=>{
  if(locked) return;
  const dy=tY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>55) goTo(cur+(dy>0?1:-1));
},{passive:true});

/* KEYS */
window.addEventListener('keydown',e=>{
  if(locked) return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight') goTo(cur+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') goTo(cur-1);
});

/* RESIZE */
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

/* ════════════════════════════════════════════════
   LOADER
════════════════════════════════════════════════ */
const MSGS=['Initializing','Building Universe','Calibrating Nodes','Connecting Systems','Ready'];
let lp=0;
const ldf=document.getElementById('ldf'), ldl=document.getElementById('ldl');
const li=setInterval(()=>{
  lp+=Math.random()*15+5; if(lp>100) lp=100;
  ldf.style.width=lp+'%';
  ldl.textContent=MSGS[Math.min(Math.floor(lp/25),4)];
  if(lp>=100){
    clearInterval(li);
    setTimeout(()=>{
      const ld=document.getElementById('loader');
      ld.style.transition='opacity .7s'; ld.style.opacity='0';
      setTimeout(()=>{
        ld.style.display='none';
        buildNode(S[0].shape,S[0].nodeC);
        renderPanel(S[0]);
        renderLoop();
      },730);
    },350);
  }
},60);
</script>
